# Render Blueprint: one free static site, rebuilt on every push to main.
services:
  - type: web
    name: tower212
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /generated/*
        name: Cache-Control
        value: public, max-age=604800
    routes: []
